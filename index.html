<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGGAL JAYA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}

#container{position:fixed;inset:0;z-index:9999;display:flex}

.door{
  width:50%;height:100%;
  transition:0.9s cubic-bezier(.77,0,.18,1);
}
.door.left{
  background: linear-gradient(90deg, #c94c5a 0%, #6b2a31 100%);
}
.door.right{
  background: linear-gradient(90deg, #4a4a4a 0%, #d0d0d0 100%);
}

#prisma{
  position:fixed;left:50%;top:50%;
  width:155px;height:155px;
  background: linear-gradient(180deg, #f5f5f5, #a0a0a0);
  transform:translate(-50%,-50%) rotate(45deg);
  box-shadow:2px 4px 15px rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:10;transition:0.6s;
}

#prisma span{
  transform:rotate(-45deg);
  font-family:Arial, sans-serif;
  font-weight:900;
  font-size:16px;
  letter-spacing:3px;
  color:#c03a48;
  text-shadow:1px 1px 0px rgba(0,0,0,0.3), -0.5px -0.5px 0px rgba(255,255,255,0.8);
}

.open .left{transform:translateX(-100%)}
.open .right{transform:translateX(100%)}
.open #prisma{transform:translate(-50%,-50%) rotate(45deg) scale(0);opacity:0}
</style>
</head>
<body>

<div id="container">
  <div class="door left"></div>
  <div class="door right"></div>
  <div id="prisma" onclick="masuk()"><span>ENGGAL JAYA</span></div>
</div>

<script>
function masuk(){
  document.getElementById('container').classList.add('open');
  setTimeout(()=>{ window.location.href='home.html'; }, 900);
}
</script>

</body>
</html>
