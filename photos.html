<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHOWCASE - Enggal Jaya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.header{background:#8b0000;color:#fff;padding:20px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo img{height:32px}
.menu{display:flex;gap:3px;font-size:10px}
.menu a{color:#fff;text-decoration:none;padding:8px 10px;border:1px solid rgba(255,255,0,.4);border-radius:5px}
.menu a.active{background:#ff0;color:#8b0000;font-weight:bold}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 10px;border-bottom:1px solid #ddd;white-space:nowrap}
.tabs button{border:none;padding:6px 14px;font-size:11px;font-weight:bold;cursor:pointer;border-radius:3px;background:#eee}
.tabs button.active{background:#8b0000;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 12px;padding:15px}
.card{cursor:pointer}
.frame{border:2px solid #999;padding:3px;background:#fff;box-shadow:0 6px 8px -4px rgba(0,0,0,.4)}
.frame img{width:100%;height:110px;object-fit:cover;display:block}
.card p{font-size:10px;text-align:center;margin-top:6px;font-weight:bold}
#popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
#popup.show{display:flex}
.pop-box{background:#fff;border-radius:8px;padding:12px;max-width:360px;width:100%;border-top:4px solid #8b0000}
.pop-box img{width:100%;height:200px;object-fit:cover}
.pop-box h3{color:#8b0000;margin:10px 0 5px;font-size:15px}
.pop-box p{font-size:13px;line-height:1.5}
.close{margin-top:10px;background:#8b0000;color:#fff;border:none;padding:8px;width:100%;font-weight:bold;border-radius:4px}
.footer{background:#2b0000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;font-size:11px;margin-top:20px}
</style>
</head>
