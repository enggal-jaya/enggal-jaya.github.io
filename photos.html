<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHOWCASE - Enggal Jaya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
.header{background:#8b0000;color:#fff;padding:20px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:99}
.logo img{height:32px}
.menu{display:flex;gap:3px;font-size:10px}
.menu a{color:#fff;text-decoration:none;padding:8px 10px;border:1px solid rgba(255,255,0,.4);border-radius:5px}
.menu a.active{background:#ff0;color:#8b0000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.grid img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:2px solid #ff0;cursor:pointer}
.footer{background:#2b0000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;font-size:11px}
/* popup */
#popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999;padding:15px}
#popup.show{display:flex}
.pop-box{background:#fff;border-radius:12px;padding:15px;max-width:340px;width:100%;border:3px solid #ff0}
.pop-box img{width:100%;height:200px;object-fit:cover;border-radius:8px}
.pop-box h3{color:#8b0000;margin:10px 0 6px}
.pop-box p{font-size:13px;line-height:1.5}
.close{margin-top:12px;background:#8b0000;color:#fff;border:none;padding:8px 16px;border-radius:6px;width:100%;font-weight:bold}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><img src="logo.png" alt="ENGGAL JAYA"></div>
  <div class="menu">
    <a href="home.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="photos.html" class="active">SHOWCASE</a>
    <a href="contact.html">CONTACT</a>
  </div>
</div>
<h2 style="text-align:center;padding:20px;color:#8b0000">SHOWCASE PEKERJAAN</h2>
<div class="grid">
  <img src="KOLTER.jpg" alt="KOLTER" onclick="openPop('KOLTER.jpg','KOLTER BLOK MESIN','Mengembalikan diameter silinder ke standar / oversize dengan presisi tinggi. Hasil halus, tidak miring.')">
  <img src="SLEEVE.jpg" alt="SLEEVE" onclick="openPop('SLEEVE.jpg','SLEEVE CRANKSHAFT','Sleeve kruk as oleng, ganti jalur oli, balance ulang biar putaran enteng dan awet.')">
  <img src="GRINDING.jpg" alt="GRINDING" onclick="openPop('GRINDING.jpg','GRINDING BLOK & HEAD','Meratakan blok dan head yang melengkung / tidak rata. Solusi anti bocor kompresi.')">
</div>

<!-- POPUP -->
<div id="popup" onclick="closePop()">
  <div class="pop-box" onclick="event.stopPropagation()">
    <img id="pop-img" src="">
    <h3 id="pop-title"></h3>
    <p id="pop-desc"></p>
    <button class="close" onclick="closePop()">TUTUP</button>
  </div>
</div>

<div class="footer"><span>Designed & Created by EMBUH</span><a href="javascript:void(0)" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="color:#fff;text-decoration:none">Top ↑</a></div>

<script>
function openPop(img,title,desc){
  document.getElementById('pop-img').src=img;
  document.getElementById('pop-title').innerText=title;
  document.getElementById('pop-desc').innerText=desc;
  document.getElementById('popup').classList.add('show');
}
function closePop(){document.getElementById('popup').classList.remove('show');}
</script>
</body>
</html>
